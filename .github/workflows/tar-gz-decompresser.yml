name: Tar.gz decompresser

on:
  workflow_dispatch:
    inputs:
      LINK:
        description: 'The file link'
        required: true
      
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: mkdir
      run: mkdir a
      
    - name: Set up dependencies
      run: sudo apt-get install wget tree tar gzip
      
    - name: Wget
      run: wget -O a/a.tar.gz '${{ github.event.inputs.LINK }}'
      
    - name: Tree after wget
      run: tree -ash "${{ github.workspace }}"
      
    - name: Unzip
      run: cd a && tar -zxvf a.tar.gz
      
    - name: Tree after unzip
      run: tree -ash "${{ github.workspace }}"
      
    - name: Process commands (Flatten directories)
      run: |
        rm -f a/a.tar.gz
        find a/ -mindepth 2 -type f -exec mv {} a/ \;
        find a/ -mindepth 1 -type d -exec rm -rf {} +

    - name: Tree after process
      run: tree -ash "${{ github.workspace }}"
        
    - name: Create Release and Upload Assets
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          shopt -s dotglob
          
          gh release create "${{ github.run_number }}" a/* \
            --title "Tar.gz decompresser 解压成功: 第 ${{ github.run_number }} 个文件" \
            --notes-file - << 'EOF'
          Tar.gz decompresser 解压的文件：${{ github.event.inputs.LINK }}
          EOF
